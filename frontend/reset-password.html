<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=https://ally-vimd.onrender.com/" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://ally-vimd.onrender.com/" />
    <script>
      window.location.replace("https://ally-vimd.onrender.com/");
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Reset your password - Ally</title>
    <link rel="stylesheet" href="styles/auth-flow.css" />
  </head>
  <body>
    <main class="auth-card">
      <h1>Choose a new password</h1>
      <p id="reset-status" class="message" aria-live="polite">
        Checking your recovery link…
      </p>
      <form id="reset-password-form" hidden>
        <label for="new-password">New password</label>
        <input
          id="new-password"
          name="new-password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        />
        <label for="confirm-new-password">Confirm new password</label>
        <input
          id="confirm-new-password"
          name="confirm-new-password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        />
        <button id="update-password-button" type="submit">Update password</button>
      </form>
      <p><a href="login.html">Return to sign in</a></p>
    </main>
    <script type="module" src="scripts/resetPassword.js"></script>
  </body>
</html>
